<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoGather 聚行 · 活动出行 AI 助手</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-dark: #4f46e5;
  --primary-bg: rgba(99,102,241,0.06);
  --accent: #f59e0b;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg: #f8f9fc;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --border: #e5e7eb;
  --border-light: #f1f5f9;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.06);
  --shadow-xl: 0 20px 40px -4px rgba(0,0,0,0.1);
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ────────────────────────────────────────────── */
.header {
  background: rgba(255,255,255,0.85);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.header-inner {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  color: var(--text);
  cursor: pointer;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: block;
  box-shadow: 0 2px 8px rgba(99,102,241,0.3);
}

.logo-word {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.02em;
}

.logo-cn {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 1px 7px;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.nav-tabs {
  display: flex;
  gap: 2px;
  background: var(--border-light);
  padding: 3px;
  border-radius: 10px;
}

.nav-tab {
  padding: 7px 16px;
  border: none;
  background: transparent;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.nav-tab:hover { color: var(--text); }
.nav-tab.active {
  background: var(--surface);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

/* ── Main Container ────────────────────────────────────── */
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 24px;
  padding-bottom: 120px;
}

/* ── Animations ────────────────────────────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(16px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(16px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to { opacity: 0; transform: translateY(-8px) scale(0.95); }
}

.animate-in {
  animation: fadeInUp 0.4s ease both;
}

.animate-in-delay-1 { animation-delay: 0.1s; }
.animate-in-delay-2 { animation-delay: 0.2s; }
.animate-in-delay-3 { animation-delay: 0.3s; }

/* ── Chat View ─────────────────────────────────────────── */
.chat-view { display: flex; flex-direction: column; gap: 24px; }

.welcome-card {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, #a78bfa 100%);
  border-radius: var(--radius-xl);
  padding: 32px 24px 28px;
  color: white;
  text-align: center;
  position: relative;
  overflow: hidden;
  animation: scaleIn 0.5s ease both;
}

.welcome-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}

.welcome-card::after {
  content: '';
  position: absolute;
  bottom: -40%;
  left: -20%;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  border-radius: 50%;
}

.welcome-card h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}

.welcome-card p {
  opacity: 0.9;
  font-size: 13px;
  max-width: 460px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  line-height: 1.6;
}

.feature-pills {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.feature-pill {
  padding: 5px 12px;
  background: rgba(255,255,255,0.18);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
}

.chat-messages {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 100px;
}

.message {
  display: flex;
  gap: 10px;
  animation: fadeInUp 0.3s ease both;
}

.message.user {
  flex-direction: row-reverse;
  animation: slideInRight 0.3s ease both;
}

.message-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.message.assistant .message-avatar {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  box-shadow: 0 2px 8px rgba(99,102,241,0.25);
}

.message.user .message-avatar {
  background: var(--border);
  color: var(--text-secondary);
}

.message-content {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.7;
}

.message.assistant .message-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  box-shadow: var(--shadow-sm);
}

.message.user .message-content {
  background: var(--primary);
  color: white;
  border-top-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(99,102,241,0.25);
}

.message-content .params-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.param-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: rgba(99,102,241,0.08);
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  border: 1px solid rgba(99,102,241,0.12);
}

.message.user .param-chip {
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.9);
}

.param-chip .label { opacity: 0.7; }
.param-chip .value { font-weight: 600; }

/* ── Typing Indicator ──────────────────────────────────── */
.typing-indicator {
  display: flex;
  gap: 10px;
  animation: fadeIn 0.3s ease;
}

.typing-dots {
  display: flex;
  gap: 4px;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  border-top-left-radius: 4px;
  box-shadow: var(--shadow-sm);
}

.typing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary-light);
  animation: pulse 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

/* ── Chat Input ────────────────────────────────────────── */
.chat-input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding: 20px 24px 24px;
  z-index: 50;
}

.chat-input-inner {
  max-width: 800px;
  margin: 0 auto;
}

.chat-input-wrapper {
  display: flex;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 6px 6px 6px 8px;
  box-shadow: var(--shadow-lg);
  transition: var(--transition);
}

.chat-input-wrapper:focus-within {
  border-color: var(--primary-light);
  box-shadow: var(--shadow-lg), 0 0 0 3px rgba(99,102,241,0.08);
}

.chat-input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 14px;
  padding: 10px 12px;
  background: transparent;
  font-family: inherit;
  resize: none;
  color: var(--text);
}

.chat-input::placeholder { color: var(--text-muted); }

.send-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}

.send-btn:hover { background: var(--primary-dark); transform: scale(1.04); }
.send-btn:active { transform: scale(0.96); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.send-btn svg { width: 18px; height: 18px; }

.quick-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.quick-action {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  font-weight: 500;
}

.quick-action:hover {
  border-color: var(--primary-light);
  color: var(--primary);
  background: var(--primary-bg);
  transform: translateY(-1px);
}

.quick-action:active { transform: translateY(0); }

/* ── Plan View ─────────────────────────────────────────── */
.plan-view { display: none; }
.plan-view.active { display: block; animation: fadeInUp 0.4s ease both; }

.plan-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

.plan-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.plan-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(99,102,241,0.1);
  color: var(--primary);
}

.plan-badge.ready {
  background: rgba(16,185,129,0.1);
  color: var(--success);
}

.plan-summary {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.7;
}

.plan-tabs {
  display: flex;
  gap: 3px;
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
  box-shadow: var(--shadow-sm);
}

.plan-tab {
  flex: 1;
  padding: 9px;
  border: none;
  background: transparent;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.plan-tab:hover { color: var(--text); background: var(--border-light); }
.plan-tab.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 6px rgba(99,102,241,0.3);
}

.plan-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

/* ── Timeline ──────────────────────────────────────────── */
.timeline { display: flex; flex-direction: column; gap: 0; }

.timeline-item {
  display: flex;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-light);
  transition: var(--transition);
}

.timeline-item:last-child { border-bottom: none; }
.timeline-item:hover { background: var(--surface-hover); margin: 0 -12px; padding: 14px 12px; border-radius: var(--radius); }

.timeline-time {
  width: 72px;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  padding-top: 3px;
}

.timeline-content h4 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 3px;
}

.timeline-price {
  display: inline-block;
  margin-left: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  background: rgba(99,102,241,0.08);
  padding: 1px 8px;
  border-radius: 10px;
  vertical-align: middle;
}

.booking-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  text-decoration: none;
  margin-top: 6px;
  padding: 3px 10px;
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 12px;
  transition: var(--transition);
}

.booking-link:hover {
  background: rgba(99,102,241,0.08);
  border-color: var(--primary);
}

.timeline-content p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.timeline-content .location {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  padding: 2px 8px;
  background: var(--border-light);
  border-radius: 12px;
}

/* ── Budget ────────────────────────────────────────────── */
.budget-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.budget-card {
  background: var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  transition: var(--transition);
}

.budget-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.budget-card .category {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.budget-card .amount {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}

.budget-card .unit {
  font-size: 11px;
  color: var(--text-secondary);
}

.budget-card .budget-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  line-height: 1.4;
}

.budget-total {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  color: white;
  box-shadow: 0 4px 12px rgba(99,102,241,0.3);
}

.budget-total .label { font-size: 12px; opacity: 0.85; font-weight: 500; }
.budget-total .amount { font-size: 28px; font-weight: 700; margin: 4px 0; }
.budget-total .unit { font-size: 12px; opacity: 0.75; }

/* ── Checklist ─────────────────────────────────────────── */
.checklist-group { margin-bottom: 20px; }
.checklist-group:last-child { margin-bottom: 0; }

.checklist-group-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.checklist-group-title .count {
  background: var(--primary-bg);
  color: var(--primary);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}

.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--border-light);
  border-radius: var(--radius);
  margin-bottom: 6px;
  transition: var(--transition);
  cursor: pointer;
  border: 1px solid transparent;
}

.checklist-item:hover {
  background: var(--surface-hover);
  border-color: var(--border);
}

.checklist-item:active {
  transform: scale(0.99);
}

@keyframes statusPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.checklist-item.status-changed .checklist-checkbox {
  animation: statusPop 0.3s ease;
}

.checklist-checkbox {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: var(--transition);
}

.checklist-item.status-confirmed .checklist-checkbox,
.checklist-item.status-completed .checklist-checkbox {
  background: var(--success);
  border-color: var(--success);
  box-shadow: 0 2px 6px rgba(16,185,129,0.3);
}

.checklist-item.status-confirmed .checklist-checkbox::after,
.checklist-item.status-completed .checklist-checkbox::after {
  content: '\2713';
  color: white;
  font-size: 11px;
  font-weight: 700;
}

.checklist-item.status-booking .checklist-checkbox {
  border-color: var(--warning);
  background: rgba(245,158,11,0.1);
}

.checklist-item.status-booking .checklist-checkbox::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--warning);
  animation: pulse 1.5s ease-in-out infinite;
}

.checklist-body { flex: 1; min-width: 0; }

.checklist-title {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 2px;
}

.checklist-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.checklist-meta {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.checklist-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.checklist-tag.price { color: var(--primary); font-weight: 600; border-color: rgba(99,102,241,0.2); background: var(--primary-bg); }

.checklist-link {
  font-size: 11px;
  color: var(--primary);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--primary-bg);
  transition: var(--transition);
}

.checklist-link:hover { background: rgbaa(99,102,241,0.12); }

/* ── Progress Bar ──────────────────────────────────────── */
.progress-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.progress-title {
  font-size: 13px;
  font-weight: 600;
}

.progress-percent {
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
}

.progress-bar {
  height: 6px;
  background: var(--border-light);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  background-size: 200% 100%;
  animation: shimmer 2s infinite;
}

.progress-stats {

  authMode: 'login',
  token: localStorage.getItem('juxing_token'),
  user: JSON.parse(localStorage.getItem('juxing_user') || 'null'),
};

// ── Auth ──────────────────────────────────────────────────
async function initAuth() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlToken = urlParams.get('token');
  const urlUsername = urlParams.get('username');

  if (urlToken && urlUsername) {
    state.token = urlToken;
    state.user = { id: '', username: urlUsername };
    localStorage.setItem('juxing_token', urlToken);
    localStorage.setItem('juxing_user', JSON.stringify(state.user));
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  if (state.token && state.user) {
    document.getElementById('authModal').classList.add('hidden');
    showUserMenu();
    await loadConversations();
    await restorePlan();
  } else {
    document.getElementById('authModal').classList.remove('hidden');
  }
}

async function loadConversations() {
  try {
    const resp = await fetch('/api/conversations', {
      headers: { 'Authorization': `Bearer ${state.token}` }
    });
    if (resp.ok) {
      const conversations = await resp.json();
      if (conversations.length > 0) {
        state.conversation = conversations;
        // Render existing conversations
        conversations.forEach(msg => {
          addMessage(msg.role, msg.content, null);
        });
      }
    }
  } catch (e) {
    console.error('Failed to load conversations:', e);
  }
}

async function restorePlan() {
  const planId = localStorage.getItem('juxing_planId');
  if (!planId) return;
  try {
    const resp = await fetch(`/api/plan/${planId}`, {
      headers: { 'Authorization': `Bearer ${state.token}` }
    });
    if (resp.ok) {
      const plan = await resp.json();
      state.planId = planId;
      state.plan = plan;
      state.structured = {
        summary: plan.summary,
        timeline: plan.timeline || [],
        budget: plan.budget || [],
        action_items: plan.action_items || [],
        room_allocation: plan.room_allocation || [],
        budget_per_person: plan.budget_per_person,
        city: plan.params?.city || '',
      };
      state.extractedParams = plan.params || {};
      showPlan(plan, planId, state.structured);
    } else {
      localStorage.removeItem('juxing_planId');
    }
  } catch (e) {
    console.error('Failed to restore plan:', e);
  }
}

function switchAuthTab(mode) {
  state.authMode = mode;
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.auth === mode));
  document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authError').textContent = '';
  document.getElementById('authPassword').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
  const confirmField = document.getElementById('authConfirmField');
  confirmField.classList.toggle('hidden', mode === 'login');
  document.getElementById('authConfirmPassword').required = mode === 'register';
  document.getElementById('authConfirmPassword').value = '';
}

async function handleAuth(e) {
  e.preventDefault();
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const confirmPassword = document.getElementById('authConfirmPassword').value;
  const errorEl = document.getElementById('authError');
  const submitBtn = document.getElementById('authSubmitBtn');
  
  errorEl.textContent = '';
  
  if (state.authMode === 'register' && password !== confirmPassword) {
    errorEl.textContent = '两次输入的密码不一致';
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = state.authMode === 'login' ? '登录中...' : '注册中...';
  
  try {
    const endpoint = state.authMode === 'login' ? '/api/login' : '/api/register';
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.detail || '操作失败');
    }
    
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('juxing_token', data.token);
    localStorage.setItem('juxing_user', JSON.stringify(data.user));
    
    document.getElementById('authModal').classList.add('hidden');
    showUserMenu();
    showToast(state.authMode === 'login' ? '登录成功' : '注册成功', 'success');
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = state.authMode === 'login' ? '登录' : '注册';
  }
}

function showUserMenu() {
  document.getElementById('userMenuWrapper').style.display = 'block';
  const initial = (state.user.username || '?')[0].toUpperCase();
  document.getElementById('userAvatar').textContent = initial;
  document.getElementById('dropdownUsername').textContent = state.user.username;
}

function toggleUserMenu() {
  document.getElementById('userDropdown').classList.toggle('hidden');
}

function logout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem('juxing_token');
  localStorage.removeItem('juxing_user');
  document.getElementById('userMenuWrapper').style.display = 'none';
  document.getElementById('userDropdown').classList.add('hidden');
  document.getElementById('authModal').classList.remove('hidden');
  document.getElementById('authUsername').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authConfirmPassword').value = '';
  document.getElementById('authError').textContent = '';
}

function authHeaders() {
  return state.token ? { 'Authorization': `Bearer ${state.token}` } : {};
}

async function authFetch(url, options = {}) {
  options.headers = { ...options.headers, ...authHeaders() };
  const resp = await fetch(url, options);
  if (resp.status === 401) {
    logout();
    showToast('登录已过期，请重新登录', 'error');
    throw new Error('未授权');
  }
  return resp;
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  const wrapper = document.getElementById('userMenuWrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    document.getElementById('userDropdown').classList.add('hidden');
  }
});

// ── Toast ─────────────────────────────────────────────────
function showToast(message, type = 'default') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ── View Switching ────────────────────────────────────────
function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  
  const hasPlan = !!state.plan;
  document.getElementById('chatView').classList.toggle('hidden', view !== 'chat' || hasPlan);
  document.getElementById('planView').classList.toggle('active', view === 'chat' && hasPlan);
  document.getElementById('executionView').classList.toggle('active', view === 'execution');
  
  if (view === 'execution') renderExecution();
}

function switchPlanTab(tab) {
  document.querySelectorAll('.plan-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('timelineTab').classList.toggle('hidden', tab !== 'timeline');
  document.getElementById('budgetTab').classList.toggle('hidden', tab !== 'budget');
  document.getElementById('tasksTab').classList.toggle('hidden', tab !== 'tasks');
}

function startOver() {
  state.plan = null;
  state.planId = null;
  state.structured = {};
  state.conversation = [];
  state.extractedParams = {};
  localStorage.removeItem('juxing_planId');
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('shareResult').style.display = 'none';
  switchView('chat');
  document.getElementById('chatInput').focus();
}

// ── Chat ──────────────────────────────────────────────────
function addMessage(role, content, params = null) {
  const messages = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  
  let paramsHtml = '';
  if (params && Object.keys(params).length > 0) {
    const labelMap = {
      city: '城市', check_in: '入住', check_out: '退房',
      origin: '出发', group_size: '人数', vibe: '偏好',
      budget: '预算', activity_type: '类型',
    };
    const chips = Object.entries(params)
      .filter(([k, v]) => v && v !== 'null' && v !== null)
      .map(([k, v]) => `<span class="param-chip"><span class="label">${labelMap[k] || k}</span> <span class="value">${v}</span></span>`)
      .join('');
    if (chips) paramsHtml = `<div class="params-preview">${chips}</div>`;
  }
  
  const avatar = role === 'user' ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
  
  div.innerHTML = `
    <div class="message-avatar">${avatar}</div>
    <div class="message-content">${content}${paramsHtml}</div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function showTypingIndicator() {
  const messages = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="message-avatar" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; box-shadow: 0 2px 8px rgba(99,102,241,0.25);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="typing-dots">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function hideTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function quickInput(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

async function sendMessage() {
  if (state.isSending) return;
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;
  
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', message);
  
  state.isSending = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  
  state.conversation.push({ role: 'user', content: message });
  showTypingIndicator();
  
  try {
    const resp = await authFetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        conversation: state.conversation.slice(-6),
        plan_id: state.planId,
      }),
    });
    
    hideTypingIndicator();
    const data = await resp.json();
    
    if (data.type === 'follow_up') {
      state.extractedParams = { ...state.extractedParams, ...data.extracted_params };
      addMessage('assistant', data.message, data.extracted_params);
      state.conversation.push({ role: 'assistant', content: data.message });
    } else if (data.type === 'plan_ready') {
      state.plan = data.plan;
      state.structured = data.structured || {};
      state.planId = data.plan_id;
      state.extractedParams = data.extracted_params;
      localStorage.setItem('juxing_planId', data.plan_id);
      addMessage('assistant', '方案已生成！点击下方查看详细内容。');
      showToast('方案已生成', 'success');
      showPlan(data.plan, data.plan_id, data.structured);
    }
  } catch (err) {
    hideTypingIndicator();
    addMessage('assistant', '出错了，请重试：' + err.message);
    showToast('请求失败', 'error');
  } finally {
    state.isSending = false;
    sendBtn.disabled = false;
  }
}

// ── Plan Display ──────────────────────────────────────────
function showPlan(plan, planId, structured = {}) {
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('planView').classList.add('active');
  
  const city = structured.city || state.extractedParams.city || plan.city || '';
  document.getElementById('planTitle').textContent = city ? `${city} 出行方案` : '出行方案';
  document.getElementById('planSummary').textContent = structured.summary || plan.markdown?.slice(0, 150) + '...' || '方案已生成，请查看时间线、预算和待办事项。';
  
  renderTimeline(structured);
  renderBudget(structured);
  renderTasks(structured);
}

function renderTimeline(structured) {
  const container = document.getElementById('timelineContent');
  const timeline = structured.timeline || [];
  
  if (timeline.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🕐</div><div class="empty-state-text">暂无时间线数据</div></div>';
    return;
  }
  
  container.innerHTML = timeline.map((item, i) => `
    <div class="timeline-item" style="animation: fadeInUp 0.3s ease ${i * 0.05}s both;">
      <div class="timeline-time">${item.time_range || ''}</div>
      <div class="timeline-content">
        <h4>${item.title || ''}${item.price ? `<span class="timeline-price">${item.price}</span>` : ''}</h4>
        <p>${item.notes || ''}</p>
        ${item.location ? `<div class="location">${item.location}</div>` : ''}
        ${item.booking_link ? `<a class="booking-link" href="${item.booking_link}" target="_blank" rel="noopener">🔗 飞猪预订/验价</a>` : ''}
      </div>
    </div>
  `).join('');
}

function renderBudget(structured) {
  const grid = document.getElementById('budgetGrid');
  const total = document.getElementById('budgetTotal');
  const budget = structured.budget || [];
  
  if (budget.length === 0) {
    grid.innerHTML = `
      <div class="budget-card"><div class="category">住宿</div><div class="amount">--</div><div class="unit">人均/晚</div></div>
      <div class="budget-card"><div class="category">交通</div><div class="amount">--</div><div class="unit">人均</div></div>
      <div class="budget-card"><div class="category">餐饮</div><div class="amount">--</div><div class="unit">人均</div></div>
      <div class="budget-card"><div class="category">活动</div><div class="amount">--</div><div class="unit">人均</div></div>
    `;
    total.innerHTML = `<div class="label">人均预算</div><div class="amount">待估算</div><div class="unit">具体价格以飞猪实时为准</div>`;
    return;
  }
  
  grid.innerHTML = budget.map((item, i) => `
    <div class="budget-card" style="animation: fadeInUp 0.3s ease ${i * 0.05}s both;">
      <div class="category">${item.category}</div>
      <div class="amount">${item.estimated_cost || '--'}</div>
      ${item.description ? `<div class="budget-desc">${item.description}</div>` : ''}
      <div class="unit">${item.is_per_person ? '人均' : '总计'}</div>
    </div>
  `).join('');
  
  total.innerHTML = `
    <div class="label">人均预算</div>
    <div>
      <div class="amount">${structured.budget_per_person || '待估算'}</div>
    </div>
    <div class="unit">具体价格以飞猪实时为准</div>
  `;
}

function renderTasks(structured) {
  const container = document.getElementById('tasksContent');
  const actionItems = structured.action_items || [];
  
  if (actionItems.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无待办事项</div></div>';
    return;
  }
  
  const groups = [
    { type: 'hotel', icon: '🏨', title: '住宿', items: [] },
    { type: 'transport', icon: '✈️', title: '交通', items: [] },
    { type: 'activity', icon: '🎯', title: '活动', items: [] },
    { type: 'restaurant', icon: '🍽️', title: '餐饮', items: [] },
  ];
  
  actionItems.forEach(item => {
    const group = groups.find(g => g.type === item.type);
    if (group) {
      group.items.push({
        id: item.id,
        title: item.title || '',
        desc: item.description || '',
        status: item.status || 'pending',
        booking_link: item.booking_link,
        estimated_cost: item.estimated_cost,
      });
    }
  });
  
  container.innerHTML = groups.filter(g => g.items.length > 0).map(g => `
    <div class="checklist-group">
      <div class="checklist-group-title">
        ${g.icon} ${g.title}
        <span class="count">${g.items.length}</span>
      </div>
      ${g.items.map(item => `
        <div class="checklist-item status-${item.status}" onclick="toggleTaskStatus(this, '${item.id}')">
          <div class="checklist-checkbox"></div>
          <div class="checklist-body">
            <div class="checklist-title">${item.title}</div>
            ${item.desc ? `<div class="checklist-desc">${item.desc}</div>` : ''}
            <div class="checklist-meta">
              ${item.estimated_cost ? `<span class="checklist-tag price">${item.estimated_cost}</span>` : ''}
              ${item.booking_link ? `<a href="${item.booking_link}" target="_blank" class="checklist-link" onclick="event.stopPropagation()">预订</a>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function toggleTaskStatus(el, taskId) {
  const statuses = ['pending', 'booking', 'confirmed', 'completed'];
  const current = statuses.find(s => el.classList.contains(`status-${s}`)) || 'pending';
  const next = statuses[(statuses.indexOf(current) + 1) % statuses.length];
  
  el.classList.remove(...statuses.map(s => `status-${s}`));
  el.classList.add(`status-${next}`);
  el.classList.add('status-changed');
  setTimeout(() => el.classList.remove('status-changed'), 300);
  
  const statusLabels = { pending: '待处理', booking: '预订中', confirmed: '已确认', completed: '已完成' };
  showToast(`${statusLabels[next]}`, 'default');
  
  if (state.planId) {
    authFetch(`/api/plan/${state.planId}/task/${taskId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: next }),
    }).catch(() => {});
  }
  
  updateProgress();
}

// ── Execution View ────────────────────────────────────────
function renderExecution() {
  if (!state.plan) return;
  
  const container = document.getElementById('executionContent');
  const tasksContent = document.getElementById('tasksContent');
  if (tasksContent && tasksContent.innerHTML.trim()) {
    container.innerHTML = tasksContent.innerHTML;
  } else {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无待办事项</div></div>';
  }
  
  renderNextActions();
  updateProgress();
}

function renderNextActions() {
  const section = document.getElementById('nextActionsSection');
  const content = document.getElementById('nextActionsContent');
  const actionItems = state.structured?.action_items || [];
  
  const pending = actionItems.filter(item => 
    item.status === 'pending' || item.status === 'booking'
  ).slice(0, 3);
  
  if (pending.length === 0) {
    section.style.display = 'none';
    return;
  }
  
  section.style.display = 'block';
  content.innerHTML = pending.map(item => `
    <div class="next-action-item">
      <div class="next-action-dot ${item.status === 'booking' ? 'urgent' : 'normal'}"></div>
      <div class="next-action-text">${item.title}</div>
      <div class="next-action-label">${item.status === 'booking' ? '预订中' : '待处理'}</div>
    </div>
  `).join('');
}

function updateProgress() {
  const container = state.currentView === 'execution' 
    ? document.getElementById('executionContent')
    : document.getElementById('tasksContent');
  const items = container ? container.querySelectorAll('.checklist-item') : [];
  const total = items.length;
  if (total === 0) return;
  
  let confirmed = 0, booking = 0, pending = 0;
  items.forEach(item => {
    if (item.classList.contains('status-confirmed') || item.classList.contains('status-completed')) confirmed++;
    else if (item.classList.contains('status-booking')) booking++;
    else pending++;
  });
  
  const percent = Math.round((confirmed / total) * 100);
  document.getElementById('progressPercent').textContent = `${percent}%`;
  document.getElementById('progressFill').style.width = `${percent}%`;
  document.getElementById('progressStats').innerHTML = `
    <span class="progress-stat"><span class="dot confirmed"></span>已确认 ${confirmed}</span>
    <span class="progress-stat"><span class="dot booking"></span>进行中 ${booking}</span>
    <span class="progress-stat"><span class="dot pending"></span>待处理 ${pending}</span>
  `;
}

// ── Share ─────────────────────────────────────────────────
async function sharePlan() {
  if (!state.planId) return;
  try {
    const resp = await authFetch(`/api/plan/${state.planId}/share`, { method: 'POST' });
    const data = await resp.json();
    if (data.share_code) {
      const shareUrl = `${window.location.origin}/share/${data.share_code}`;
      document.getElementById('shareLink').href = shareUrl;
      document.getElementById('shareLink').textContent = shareUrl;
      document.getElementById('shareResult').style.display = 'block';
      showToast('分享链接已生成', 'success');
    }
  } catch (err) {
    showToast('分享失败', 'error');
  }
}

function copyShareLink() {
  const link = document.getElementById('shareLink').href;
  navigator.clipboard.writeText(link).then(() => {
    showToast('已复制到剪贴板', 'success');
  }).catch(() => {
    showToast('复制失败，请手动复制', 'error');
  });
}

// ── Init ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initAuth();
  document.getElementById('chatInput').focus();
});
