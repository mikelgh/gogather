<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>聚行 · 活动出行 AI 助手</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2a37; --sub:#6b7280;
    --brand:#0ea5a4; --brand2:#2563eb; --line:#e5e7eb; --shadow:0 10px 30px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6}
  .hero{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:34px 20px 28px}
  .hero h1{margin:0 0 6px;font-size:26px;letter-spacing:1px}
  .hero p{margin:0;opacity:.92;font-size:14px}
  .wrap{max-width:820px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
  .mode{display:flex;gap:10px;margin-bottom:16px}
  .mode button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;font-size:15px;color:var(--sub);transition:.15s}
  .mode button.active{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;font-weight:600}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--brand)}
  .row{display:flex;gap:12px}
  .row>div{flex:1}
  .submit{margin-top:18px;width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--brand),var(--brand2))}
  .submit:disabled{opacity:.6;cursor:not-allowed}
  .submit-row{display:flex;gap:12px;margin-top:18px}
  .submit-row .submit{margin-top:0;flex:2}
  .ghost{flex:1;padding:14px;border:1px solid var(--brand);background:#fff;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;color:var(--brand)}
  .ghost:hover{background:#ecfeff}
  .innovate{font-size:14px;color:var(--ink);background:linear-gradient(120deg,#ecfeff,#f0fdfa);border-color:#a5f3fc;line-height:1.7}
  .innovate strong{color:#0e7490}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .result{display:none}
  .result h2{margin:0 0 4px;font-size:20px}
  .toolbar{display:flex;gap:10px;margin:14px 0}
  .toolbar button{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:13px;color:var(--brand2)}
  .rendered{font-size:15px}
  .rendered h1{font-size:22px;margin:14px 0 8px}
  .rendered h2{font-size:18px;margin:16px 0 6px;color:var(--brand2);border-left:4px solid var(--brand);padding-left:8px}
  .rendered h3{font-size:16px;margin:12px 0 4px}
  .rendered p{margin:8px 0}
  .rendered ul,.rendered ol{margin:8px 0;padding-left:22px}
  .rendered li{margin:4px 0}
  .rendered a{color:var(--brand2);text-decoration:none;border-bottom:1px dashed var(--brand2)}
  .rendered code{background:#f1f5f9;padding:1px 5px;border-radius:5px;font-size:13px}
  .rendered table.plan-table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
  .rendered table.plan-table th,.rendered table.plan-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .rendered table.plan-table th{background:#f0fdfa;color:#0e7490;font-weight:600}
  .rendered table.plan-table tr:nth-child(even) td{background:#fafafa}
  .rendered strong{color:var(--ink)}
  .badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:#ecfeff;color:#0e7490;margin-left:8px}
  .loading{text-align:center;color:var(--sub);padding:30px}
  .err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;font-size:14px}
  .raw{margin-top:14px;font-size:12px;color:var(--sub)}
  .raw summary{cursor:pointer}
  .raw pre{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:240px;overflow:auto}
  .warn{display:none;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;line-height:1.7}
</style>
</head>
<body>
  <div class="hero">
    <h1>聚行 · 活动出行 AI 助手</h1>
    <p>说一场活动/聚会，AI 帮你拉飞猪真实酒店、景点与交通，生成可分享出行方案</p>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="mode">
        <button id="m-event" class="active" onclick="setMode('event')">🎉 活动/聚会出行</button>
        <button id="m-explore" onclick="setMode('explore')">🧭 目的地探索</button>
      </div>

      <label>城市 <span style="color:#ef4444">*</span></label>
      <input id="city" placeholder="如：杭州" />

      <div class="row">
        <div>
          <label>入住日期</label>
          <input id="check_in" type="date" />
        </div>
        <div>
          <label>退房日期</label>
          <input id="check_out" type="date" />
        </div>
      </div>

      <label>出发地（外地出行才填，用于机票建议）</label>
      <input id="origin" placeholder="如：广州" />

      <div class="row">
        <div>
          <label>人数</label>
          <input id="group_size" placeholder="如：10 人" />
        </div>
        <div>
          <label>氛围/偏好</label>
          <input id="vibe" placeholder="如：安静湖景、亲子、预算友好" />
        </div>
      </div>

      <div class="submit-row">
        <button class="submit" id="go" onclick="runPlan()">生成出行方案</button>
        <button class="ghost" id="demo" onclick="loadDemo()">✨ 一键示例</button>
      </div>
      <div class="hint">飞猪 AI 开放平台体验模式即可出结果；配置百炼 Key 后方案由通义千问润色。点「一键示例」可秒看真实场景方案。</div>
    </div>

    <div class="card innovate">
      <strong>💡 创新点</strong>：聚行不规划"去哪玩"，而是围绕 <strong>一场活动 / 聚会</strong> 来规划出行——替团体操心统一预订、集体签到接驳、分组动线与聚餐，把"订一堆零散东西"变成"一份可分享的方案"。
    </div>

    <div class="card result" id="resultCard">
      <h2 id="resTitle">出行方案 <span class="badge" id="resBadge"></span></h2>
      <div class="warn" id="warnBox"></div>
      <div class="toolbar">
        <button onclick="copyMd()">复制 Markdown</button>
        <button onclick="downloadMd()">导出 .md</button>
      </div>
      <div class="rendered" id="rendered"></div>
      <details class="raw">
        <summary>查看原始飞猪数据</summary>
        <pre id="rawData"></pre>
      </details>
    </div>
  </div>

<script>
let MODE = 'event';

function setMode(m){
  MODE = m;
  document.getElementById('m-event').classList.toggle('active', m==='event');
  document.getElementById('m-explore').classList.toggle('active', m==='explore');
}

function loadDemo(){
  setMode('event');
  document.getElementById('city').value = '广州';
  document.getElementById('check_in').value = '2026-10-25';
  document.getElementById('check_out').value = '2026-10-26';
  document.getElementById('origin').value = '';
  document.getElementById('group_size').value = '30 人';
  document.getElementById('vibe').value = '中山大学校友 30 周年聚会，安静有纪念意义';
  runPlan();
}

function mdToHtml(md){
  if(!md) return '';
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = esc(md).split('\n');
  let html='', i=0, inList=false;
  const closeList=()=>{ if(inList){html+='</ul>'; inList=false;} };
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 分隔行判定：仅含 | 与 -，且含有 '--'
  const isSep = l => l.includes('|') && /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.replace(/[^|-]/g,'').includes('--');
  const cellSplit = row => row.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  while(i < lines.length){
    let l = lines[i];
    // 表格块：当前行含 | 且下一行是分隔行
    if(l.includes('|') && i+1 < lines.length && isSep(lines[i+1])){
      closeList();
      const head = cellSplit(l).map(c=>'<th>'+inline(c)+'</th>').join('');
      let t = '<table class="plan-table"><thead><tr>'+head+'</tr></thead><tbody>';
      i += 2; // 跳过表头行与分隔行
      while(i < lines.length && lines[i].includes('|') && lines[i].trim() !== ''){
        t += '<tr>'+cellSplit(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
        i++;
      }
      t += '</tbody></table>';
      html += t;
      continue;
    }
    if(/^###\s+/.test(l)){ closeList(); html+='<h3>'+inline(l.replace(/^###\s+/,''))+'</h3>'; }
    else if(/^##\s+/.test(l)){ closeList(); html+='<h2>'+inline(l.replace(/^##\s+/,''))+'</h2>'; }
    else if(/^#\s+/.test(l)){ closeList(); html+='<h1>'+inline(l.replace(/^#\s+/,''))+'</h1>'; }
    else if(/^[-*]\s+/.test(l)){ if(!inList){html+='<ul>'; inList=true;} html+='<li>'+inline(l.replace(/^[-*]\s+/,''))+'</li>'; }
    else if(/^\d+\.\s+/.test(l)){ if(!inList){html+='<ul>'; inList=true;} html+='<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>'; }
    else if(l.trim()===''){ closeList(); }
    else { closeList(); html+='<p>'+inline(l)+'</p>'; }
    i++;
  }
  closeList();
  return html;
}

async function runPlan(){
  const btn = document.getElementById('go');
  const card = document.getElementById('resultCard');
  const rendered = document.getElementById('rendered');
  const city = document.getElementById('city').value.trim();
  if(!city){ alert('请填写城市'); return; }
  btn.disabled = true; btn.textContent = '生成中…';
  card.style.display='block';
  card.scrollIntoView({behavior:'smooth', block:'start'});
  rendered.innerHTML = '<div class="loading">正在向飞猪 AI 拉取真实数据并生成方案…</div>';
  const payload = {
    mode: MODE,
    city,
    check_in: document.getElementById('check_in').value,
    check_out: document.getElementById('check_out').value,
    origin: document.getElementById('origin').value.trim(),
    group_size: document.getElementById('group_size').value.trim(),
    vibe: document.getElementById('vibe').value.trim(),
  };
  try{
    const r = await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data = await r.json();
    if(!r.ok){ throw new Error(data.detail||'请求失败'); }
    document.getElementById('resBadge').textContent = data.used_llm ? 'Qwen 润色' : '模板拼接';
    document.getElementById('resTitle').firstChild.textContent = (data.city||'') + ' 出行方案 ';
    const wb = document.getElementById('warnBox');
    if(data.warnings && data.warnings.length){
      document.getElementById('resBadge').textContent = '⚠️ 数据异常';
      wb.style.display = 'block';
      wb.innerHTML = data.warnings.map(w=>'• '+w).join('<br>');
    } else {
      wb.style.display = 'none';
      wb.innerHTML = '';
    }
    rendered.innerHTML = mdToHtml(data.markdown);
    document.getElementById('rawData').textContent = JSON.stringify(data.sections, null, 2);
    window.__lastMd = data.markdown;
  }catch(e){
    rendered.innerHTML = '<div class="err">出错了：'+e.message+'</div>';
  }finally{
    btn.disabled=false; btn.textContent='生成出行方案';
  }
}

function copyMd(){
  if(!window.__lastMd) return;
  navigator.clipboard.writeText(window.__lastMd).then(()=>alert('已复制 Markdown'));
}

function downloadMd(){
  if(!window.__lastMd) return;
  const blob = new Blob([window.__lastMd],{type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '聚行出行方案.md';
  a.click();
}
</script>
</body>
</html>
