[project]
name = "feizhu-travel-ai"
version = "0.1.0"
description = "聚行 · 飞猪×阿里云百炼 AI 旅行创新大赛参赛项目（活动/聚会出行 AI 助手）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
